spring:
  application:
    name: refound

  # Loads backend/.env as properties, so ${DATABASE_URL} and friends resolve.
  # "optional:" means the app still starts if .env is absent (e.g. in CI,
  # where the same names arrive as real environment variables instead).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}
    refresh-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:30}
  storage:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  matching:
    score-threshold: ${MATCH_SCORE_THRESHOLD:0.55}
    weights:
      category: 0.30
      time: 0.20
      location: 0.20
      text: 0.20
      attributes: 0.10
  items:
    expiry-days: ${ITEM_EXPIRY_DAYS:90}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
