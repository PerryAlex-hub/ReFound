# Render blueprint for the ReFound API.
#
# Java is not one of Render's native runtimes (Node, Python, Ruby, Go, Rust and
# Elixir are), so the service is deployed as a Docker container — which Render
# documents as the way to run "virtually any language". backend/Dockerfile does
# the build.
#
# To use this: Render dashboard -> New -> Blueprint -> pick this repository.
# Everything marked `sync: false` is a secret and must be filled in by hand in
# the dashboard; those values never belong in source control.
#
# The database is Neon rather than a Render Postgres instance, so there is no
# database block here — the connection details arrive as environment variables.

services:
  - type: web
    name: refound-api
    runtime: docker
    plan: free
    region: oregon              # move closer to your Neon region if you change it

    # Monorepo: build only the backend, and treat that folder as the Docker
    # build context so the Dockerfile's relative COPY paths resolve.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Public, unauthenticated, status only. Render polls this to decide whether
    # the instance is alive.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Database (Neon) ---
      # Use the POOLED endpoint (host contains "-pooler"): this app runs its own
      # connection pool and the pooled endpoint is built for that.
      # DATABASE_URL must be the JDBC form:
      #   jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # --- Auth ---
      # Generate a NEW one for production; never reuse the development secret.
      #   openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: "30"

      # --- Frontend origin ---
      # Drives CORS. Must be the exact deployed frontend URL, scheme included,
      # no trailing slash. Requests from any other origin are blocked.
      - key: APP_BASE_URL
        sync: false

      # --- Cloudinary ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Tuning ---
      - key: MATCH_SCORE_THRESHOLD
        value: "0.55"
      - key: ITEM_EXPIRY_DAYS
        value: "90"

      # --- Mail ---
      # Not wired up yet. Left unset deliberately: the app starts without it,
      # and notifications are stored in-app until email is implemented.
      - key: MAIL_FROM
        value: noreply@refound.app
